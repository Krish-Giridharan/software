<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fleet Operations Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Fleet Operations Dashboard</h1>
    <div id="summary" class="card">
      <div>Total Vehicles: <span id="total">0</span></div>
      <div>Maintenance Required: <span id="maintenance">0</span></div>
    </div>

    <div class="card">
      <h2>Add Vehicle</h2>
      <form id="vehicleForm">
        <input name="vehicle_number" placeholder="Vehicle Number" required />
        <input name="vehicle_type" placeholder="Type" />
        <input name="mileage" placeholder="Mileage" type="number" />
        <input name="next_service_date" placeholder="Next Service Date (YYYY-MM-DD)" />
        <button type="submit">Add</button>
      </form>
    </div>

    <div class="card">
      <h2>Vehicles</h2>
      <table id="vehiclesTable">
        <thead><tr><th>No</th><th>Vehicle</th><th>Type</th><th>Mileage</th><th>Next Service</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
