
services:
  backend:
    build:
      context: ./backend
    container_name: fleet-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://fleetuser:fleetpassword@database:5432/fleetdb
    depends_on:
      - database

  database:
    image: postgres:16-alpine
    container_name: fleet-database
    environment:
      POSTGRES_DB: fleetdb
      POSTGRES_USER: fleetuser
      POSTGRES_PASSWORD: fleetpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build: .
    container_name: fleet-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
